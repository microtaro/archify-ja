name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: archify/package-lock.json
      - name: Install renderer dependencies
        run: npm ci
        working-directory: archify
      - name: Golden-file + schema tests
        run: npm test
        working-directory: archify

  webm-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision a known Chrome runtime
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install the WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Decode a real motion export and reject static frames
        run: npm run test:webm
        working-directory: archify
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Verify the real 1440x900 adaptive reader remains readable
        run: node --test test/desktop-reader-browser.test.mjs
        working-directory: archify
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify all five diagram modes localize Viewer interactions
        run: node --test test/i18n.test.mjs
        working-directory: archify
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify Semantic Radar collision and drag behavior
        run: node --test test/semantic-radar.test.mjs
        working-directory: archify
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - name: Verify Viewer chrome stays clear of SVG legends
        run: node --test test/viewer-chrome-layout.test.mjs
        working-directory: archify
        env:
          ARCHIFY_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, webm-artifact]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject an obsolete deployment run
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete Pages deployment for ${GITHUB_SHA}; main is ${current_main}"
          fi
      - name: Configure GitHub Pages
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/configure-pages@v5
      - name: Upload checked documentation
        if: steps.deployment-head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy checked documentation
        if: steps.deployment-head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
